name: Build AegisShield Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant Execute Permission to gradlew
      run: chmod +x mobile-android/gradlew

    - name: Build Debug APK
      working-directory: mobile-android
      run: |
        set -o pipefail
        ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle_build.log

    - name: Report Build Error Log
      if: failure()
      run: |
        echo "### ❌ Android Build Error Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 80 gradle_build.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload Build Log If Failed
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Error-Log
        path: gradle_build.log

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AegisShield-Android-APK
        path: mobile-android/app/build/outputs/apk/debug/*.apk

    - name: Publish Direct GitHub Release
      if: success() && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "AegisShield Android APK v1.0.0"
        body: |
          ## 🛡️ AegisShield Android Official APK Download
          
          Direct download link for Android smartphones:
          - Tap **`app-debug.apk`** below to download directly without login.
          - Transfer via WhatsApp or install directly.
          - Includes Anti-Uninstall Tamper Protection & Cinema Nudity Shield.
        draft: false
        prerelease: false
        files: mobile-android/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
